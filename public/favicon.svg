<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0f172a" />
      <stop offset="1" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" />
      <stop offset="0.5" stop-color="#8b5cf6" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <linearGradient id="barGrad1" x1="12" y1="52" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6366f1" />
      <stop offset="0.6" stop-color="#818cf8" />
      <stop offset="1" stop-color="#34d399" />
    </linearGradient>
    <linearGradient id="barGrad2" x1="12" y1="52" x2="30" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#4f46e5" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
  </defs>

  <!-- Base Card com borda gradiente -->
  <rect x="0" y="0" width="64" height="64" fill="url(#bgGrad)" />

  <!-- Barras do gráfico -->
  <rect x="12" y="36" width="9" height="16" rx="4" fill="url(#barGrad2)" opacity="0.8" />
  <rect x="25" y="26" width="9" height="26" rx="4" fill="url(#barGrad1)" opacity="0.9" />
  <rect x="38" y="16" width="9" height="36" rx="4" fill="url(#barGrad1)" />

  <!-- Linha de tendência com brilho -->
  <path d="M12 37 L26 25 L36 32 L51 13" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="51" cy="13" r="3.5" fill="#34d399" stroke="#ffffff" stroke-width="2" />
</svg>